# The Windows port (ADR 0039) cannot be run anywhere but on Windows, so this does it: builds, runs the app's own
# self-test (AXON_SELFTEST: the real window and a real PowerShell through ConPTY; see src/wlapp/selftest.rs), keeps what
# it saw (the report and a screenshot of the window) as artifacts, then runs the unit tests.
name: Windows

on:
  push:
    branches: [main, windows-port]
    paths:
      - "src/**"
      - "Cargo.*"
      - "scripts/*.ps1"
      - "scripts/argb2png.py"
      - "assets/axon.ico"
      - ".github/workflows/windows.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build
        run: cargo build --release --locked

      - name: Self-test
        shell: pwsh
        run: scripts/selftest.ps1 -Out selftest-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest-out
          if-no-files-found: warn

      - name: Tests
        if: always()
        run: cargo test --release --locked

      # The release bundle and its installers, in a throwaway folder, from a local "release" (AXON_RELEASES).
      - name: Package and install
        if: always()
        shell: pwsh
        run: |
          scripts/package.ps1 -NoBuild
          $dist = (Resolve-Path target\dist).Path
          Get-ChildItem $dist
          $env:AXON_RELEASES = ([Uri]$dist).AbsoluteUri
          # The release URLs are <base>/latest/download/<name>: lay the bundle out that way.
          New-Item -ItemType Directory -Force "$dist\latest\download" | Out-Null
          Copy-Item "$dist\axon-x86_64-windows.zip*" "$dist\latest\download"
          $prefix = Join-Path $env:RUNNER_TEMP 'axon-prefix'
          $env:AXON_PREFIX = $prefix
          scripts/get.ps1
          if (-not (Test-Path "$prefix\axon.exe")) { throw 'axon.exe was not installed' }
          if (-not (Test-Path "$prefix\axon.ico")) { throw 'axon.ico was not installed' }
          & "$prefix\axon.exe" --version | Out-String
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -ieq $prefix })) { throw 'the prefix is not on the user PATH' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'axon.lnk'))) { throw 'no Start menu shortcut' }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\axon')) { throw 'no Apps entry' }
          scripts/get.ps1 -Uninstall
          Start-Sleep 4
          if (Test-Path "$prefix\axon.exe") { throw 'axon.exe is still there after the uninstall' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'axon.lnk')) { throw 'the shortcut is still there' }
          Write-Host 'install and uninstall: ok'
