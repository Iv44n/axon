[package]
name = "axon"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.5"
pollster = "1.0.3"
wgpu = "30.0.2"
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
